name: load-shedding forecast

# NLDC publishes the daily report at about 11:00 Bangladesh time (05:00 UTC).
# Two runs: one soon after, one two hours later in case the report is late.
on:
  schedule:
    - cron: '30 5 * * *'
    - cron: '30 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: loadshed-forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy lightgbm scikit-learn
      - name: Fetch the newest NLDC report and forecast
        run: python ml/loadshed_live.py
      - name: Commit the forecast
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/loadshed/live.json public/data/loadshed/live_state.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "data: load-shedding forecast $(date -u +%F)"
          git pull --rebase
          git push
